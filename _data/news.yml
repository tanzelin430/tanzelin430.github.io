- date: "2026.08"
  datetime: "2026-08"
  image: "/images/news/skt-overview.png"
  image_fit: "contain"
  image_alt: "SKT overview"
  description: >-
    We released [SKT](https://arxiv.org/abs/2608.02287), a verified synthetic-data pipeline for training language-model agents to identify, apply, and coordinate reusable skills at scale.
  resources:
    - label: "Paper"
      url: "https://arxiv.org/abs/2608.02287"
    - label: "HF Dataset"
      url: "https://huggingface.co/datasets/Artemis0430/skilleval-v1"

- date: "2026.06"
  datetime: "2026-06"
  image: "/images/news/agents-a1-overview.png"
  image_fit: "contain"
  image_alt: "Agents-A1 model overview"
  description: >-
    We released [Agents-A1](https://huggingface.co/InternScience/Agents-A1), an open 35B MoE agent model that scales the interaction horizon for long-horizon search, engineering, and scientific reasoning.
